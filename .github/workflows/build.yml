name: Build Novus Client

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.8'

      - name: Build mod
        run: gradle build --no-daemon

      - name: Upload Novus Client JAR
        uses: actions/upload-artifact@v4
        with:
          name: novus-client
          path: build/libs/*.jar
          if-no-files-found: error
