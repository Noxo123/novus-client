name: Build Novus Client

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.8'
          cache-cleanup: on-success

      - name: Clean previous Gradle state
        run: gradle --stop || true

      - name: Build Novus Client
        run: gradle clean build --refresh-dependencies --no-daemon --stacktrace --warning-mode all

      - name: Verify generated JAR
        run: |
          echo "Generated files:"
          find build/libs -maxdepth 1 -type f -printf '%f\n'
          test -n "$(find build/libs -maxdepth 1 -name '*.jar' -type f -print -quit)"

      - name: Upload Novus Client JAR
        uses: actions/upload-artifact@v4
        with:
          name: novus-client
          path: build/libs/*.jar
          if-no-files-found: error
